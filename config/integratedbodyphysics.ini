; Integrated Body Physics settings. Changes made while playing (the console: jiggle on | off |
; breasts 1.5 | butt 0 | status, or the Sims 4 VR debug menu) go to integratedbodyphysics_user.ini, which wins.
[jiggle]
on = 1
; Who jiggles: your own (active) Sim, other Sims (1 = yes).
own = 1
others = 1
; Arms and hands push them (1 = yes), and how thick the arms count as (1 = normal).
arm_push = 1
arm_size = 1
; Your Sim's forearms, palms and fingers (the VR hands) push other Sims' breasts when within 2 m: 1 = on.
your_hands = 1
; Holding: press grip and trigger together with your VR hand on a breast to hold it, let go to release (1 = on).
; grab_reach = metres a held breast can be pulled from where it rests; grab_press = how far both must be pressed (0..1).
grab = 1
grab_reach = 0.12
grab_press = 0.6
; How far your VR fingers close holding a breast / the butt (0 open .. 1 a fist). Without Integrated Body Physics the VR grab_curl applies.
breast_grab_curl = 0.45
butt_grab_curl = 0.45
; Women's pie menus get "Body Physics" (outfits, set a top as nude/clothed, Cup size, Gravity, Spacing): 1 = on.
outfit_pie = 1
; Switch the breasts or the butt off on their own (1 = on).
breasts_on = 1
butt_on = 1
; Only Sims within this many metres of your Sim jiggle (0 = any distance). Saves work.
breast_distance = 0
butt_distance = 0

; BREASTS: four size presets, each with every breast setting, as <size>_breast_<setting>:
;   sizes: small, medium, bigger, huge (a Sim uses the one her pie Cup size sets, else the one her CAS size picks)
;   settings: strength, hz, damping, max_up, max_down, max_side, max_front, up, side, front, gravity,
;   size (radius her own arms push against), size_you (radius your hands push against), apart, swing, squish,
;   clothed_strength, clothed_hz, clothed_damping, clothed_gravity, clothed_apart
; e.g. huge_breast_hz = 2.2. Set them in the Sims 4 VR debug menu (Jiggle physics > Breasts). Not listed here on
; purpose: a key listed here would stop your 0.10.0 breast settings from carrying over the first time.
; 0.11 effects, each off until switched on (1 = on): a wall down her middle (pushed together they press into it
; instead of overlapping), Swing (they tilt with the movement), Squish (flatten where pressed), Weight (heavier lag).
middle_wall = 0
swing_on = 0
squish_on = 0
weight_on = 0
; Which preset her CAS size picks: her breast bone's scale (logged as "Size:") at or above these.
cup_medium_at = 1.6
cup_bigger_at = 2.1
cup_huge_at = 2.5

; BUTT: the game's rig has no butt bone, so the thigh twist bones (lower butt and upper
; thighs) move, or b__L_Butt__/b__R_Butt__ when a mod's rig adds them.
butt = 1
butt_hz = 4.0
butt_damping = 0.3
butt_max = 0.02
butt_up = 1
butt_side = 1
butt_front = 1
butt_gravity = 0
butt_size = 0.05
butt_clothed_strength = 0.6
butt_clothed_hz = 1.3
butt_clothed_damping = 1.5
butt_clothed_gravity = 0
; Windows key code that opens the mod's own menu when the Sims 4 VR mod isn't loaded (190 = the '.' key).
menu_key = 190
; RTBP (d3d11.dll in the game's Bin folder) found: 0 = stay off, 1 = run anyway.
with_rtbp = 0
; Research (0.11.8+): 1 = log how the game draws Sims at game start (integratedbodyphysics.log, integratedbodyphysics_shaders.bin);
; 2 = capture bone palettes for the shader features (integratedbodyphysics_palette.bin, 0.11.11+).
; Read-only, changes no drawing. On for this build only, to plan the bulge, wave and butt shader features.
shader_probe = 0
